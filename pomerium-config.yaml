routes:
  # Проверка роутов идёт сверху вниз, поэтому более специфичные роуты должны быть выше.
  # /about - only test-about group
  - from: "https://localhost:8080"
    to: "http://hugo:1313"
    prefix: "/docs-pilot"
    policy:
      - allow:
          or:
            - claim/groups: docs-trainer-pilots
    preserve_host_header: true

  # Everything else - allow any authenticated user. Important! This section must be below others.
  - from: "https://localhost:8080"
    to: "http://hugo:1313"
    prefix: "/"
    allow_any_authenticated_user: true
    preserve_host_header: true

address: ":8080"