
{{- $sharedSecret := coalesce .Values.sharedSecret (randAscii 32 | b64enc) }}
{{- $cookieSecret := coalesce .Values.cookieSecret (randAscii 32 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: shared-secret
  labels:
    {{- include "hugo.labels" . | nindent 8 }}
    {{- with .Values.podLabels }}
    {{- toYaml . | nindent 8 }}
    {{- end }}
type: Opaque
data:
  SHARED_SECRET: {{ $sharedSecret | b64enc }}
  COOKIE_SECRET: {{ $cookieSecret | b64enc }}