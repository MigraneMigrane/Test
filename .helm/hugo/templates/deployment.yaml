apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hugo.fullname" . }}
  labels:
    {{- include "hugo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hugo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        deployment/revision: "{{ .Values.image.docs.tag | default .Chart.AppVersion }}"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hugo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.docs.repository }}:{{ .Values.image.docs.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: promerium
          image: "{{ .Values.image.promerium.repository }}:{{ .Values.image.promerium.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: IDP_PROVIDER
              value: {{ .Values.idp.provider }}
            - name: IDP_PROVIDER_URL
              value: {{ .Values.idp.url }}
            - name: IDP_SCOPES
              value: {{ .Values.idp.scopes }}
            - name: AUTHENTICATE_SERVICE_URL
              value: "https://auth.{{ .Values.httpproxy.host }}"
            - name: AUTHORIZE_SERVICE_URL
              value: "https://{{ .Values.httpproxy.host }}"
            - name: DATABROKER_SERVICE_URL
              value: "https://{{ .Values.httpproxy.host }}"
            - name: LOG_LEVEL
              value: "info"
            - name: INSECURE_SERVER
              value: "true"
            - name: ADDRESS
              value: ":8080"
            - name: IDP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: clientId
            - name: IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: clientSecret
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: COOKIE_SECRET
            - name: SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SHARED_SECRET
          ports:
            - name: promerium
              containerPort: {{ .Values.service.promerium.port }}
              protocol: TCP
          volumeMounts:
            - name: promerium-config
              mountPath: /pomerium/config.yaml
              subPath: config.yaml
      volumes:
        - name: promerium-config
          configMap:
            name: promerium-config
            items:
              - key: config.yaml
                path: config.yaml
